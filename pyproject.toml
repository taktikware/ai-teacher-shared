[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-teacher-shared"
version = "1.1.0"
description = "Shared utilities and validators for AI Teacher microservices"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Taktikware", email = "info@taktikware.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "fastapi>=0.100.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/taktikware/ai-teacher-shared"
Repository = "https://github.com/taktikware/ai-teacher-shared"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_teacher_shared*"]

[tool.setuptools.package-data]
ai_teacher_shared = ["map/*.yaml"]
